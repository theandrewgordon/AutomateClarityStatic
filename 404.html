<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | AutomateClarity</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0c1d22" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --paper:#f4f1e9; --ink:#0c1d22; --blue:#2d68ff; }
    * { box-sizing:border-box; }
    body { margin:0; display:grid; min-height:100vh; place-items:center; padding:24px; background:var(--paper); color:var(--ink); font-family:Inter,Arial,sans-serif; }
    main { max-width:660px; }
    .kicker { display:block; margin-bottom:24px; font-size:12px; font-weight:700; letter-spacing:.15em; color:var(--blue); }
    h1 { margin:0 0 24px; font-family:Georgia,serif; font-size:clamp(58px,10vw,104px); font-weight:400; line-height:.92; letter-spacing:-.055em; }
    p { max-width:500px; margin-bottom:34px; font-size:17px; line-height:1.7; color:#59676a; }
    a { display:inline-flex; padding:16px 22px; background:var(--blue); color:white; font-weight:700; text-decoration:none; }
    a:focus-visible { outline:3px solid var(--ink); outline-offset:4px; }
  </style>
</head>
<body>
  <main>
    <span class="kicker">404 / NOT FOUND</span>
    <h1>Looks like this process took a wrong turn.</h1>
    <p>The page you're looking for doesn't exist. The good news: this one is easy to fix.</p>
    <a href="/">Back to AutomateClarity →</a>
  </main>
</body>
</html>
